<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Harita Tahmini</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Nunito:wght@400;600;800&display=swap">
<link rel="stylesheet" href="../assets/style.css">
<style>
:root{--c0:#4fc3f7;--c1:#ff8a5c;--c2:#b49cff;--c3:#5fd38a;--c4:#ff6b9e;--c5:#ffd23f;--c6:#f2f3fb;--c7:#a1775f}
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-weight:800;font-size:.9rem;padding:9px 14px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accentink)}
.q{font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,5vw,2rem);line-height:1.2}
.q b{color:var(--accent)}
.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.sec{font-family:var(--display);font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:6px;background:var(--edge);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:100%}
.bar i.low{background:var(--bad)}
.mapbox{border-radius:14px;overflow:auto;background:#0d2c4f;border:1px solid var(--edge);-webkit-overflow-scrolling:touch}
.mapbox svg{display:block;width:100%;height:auto;cursor:crosshair;touch-action:manipulation}
.mapbox.zoom svg{width:220%}
.mapbox svg .land{fill:#2f3a66;stroke:#4a568f;stroke-width:.6}
.mapbox svg .tr{fill:#46558f;stroke:#c9d3ff;stroke-width:1}
.mapbox svg .grid{stroke:rgba(255,255,255,.05);stroke-width:.6}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ppl{display:flex;gap:8px;flex-wrap:wrap}
.ppl span{font-weight:800;font-size:.85rem;padding:4px 10px;border-radius:999px;border:1px solid var(--edge)}
.ppl span.ok{border-color:var(--good);color:var(--good)}
.rows{display:flex;flex-direction:column;gap:6px}
.rw{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--table);font-weight:700}
.rw i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.rw.win{outline:2px solid var(--good)}
.rw b{font-variant-numeric:tabular-nums}
.crown{color:var(--good);font-weight:800}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
td,th{padding:8px 6px;border-bottom:1px solid var(--edge);text-align:left}
th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.n,th.n{text-align:right}
@keyframes drop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
.pin{animation:drop .35s ease-out}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="home" href="../">ATI <b>OYUN</b></a><h1>Harita Tahmini</h1></div>
  <main id="app"></main>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="../assets/ek.js"></script>
<script src="../assets/net.js"></script>
<script src="veri.js"></script>
<script src="logic.js"></script>
<script>
const app = document.getElementById('app'), esc = Ati.esc;
let mode = 'tr', count = 10, V, C, qKey = '', deadline = 0, timerFor = '', raf = 0, pick = null, zoom = false;
const col = i => `var(--c${i % 8})`;
const M = () => HARITA[V.mode];
const proj = (lat, lon) => { const m = M(); return [(lon - m.box[0]) * m.k * m.cosf, (m.box[3] - lat) * m.k] };
const unproj = (x, y) => { const m = M(); return { lon: x / (m.k * m.cosf) + m.box[0], lat: m.box[3] - y / m.k } };
const fmtKm = d => d.toLocaleString('tr-TR') + ' km';
function tick() {
  const bar = document.getElementById('tbar'), sec = document.getElementById('tsec');
  if (!bar || !V || V.phase !== 'q') { raf = 0; return }
  const left = Math.max(0, deadline - performance.now());
  bar.style.width = (left / Harita.TIME * 100) + '%'; bar.classList.toggle('low', left < 6000); sec.textContent = Math.ceil(left / 1000);
  raf = requestAnimationFrame(tick);
}
let PS = 1;
function pinSvg(x, y, c, label, big) {
  const r = (big ? 9 : 7) * PS;
  return `<g class="pin"><path d="M${x} ${y} l${-r * 0.7} ${-r * 1.6} a${r} ${r} 0 1 1 ${r * 1.4} 0 z" fill="${c}" stroke="#0d1126" stroke-width="${1.5 * PS}"/><circle cx="${x}" cy="${y - r * 2}" r="${r * 0.38}" fill="#0d1126"/>
    ${label ? `<text x="${x}" y="${y - r * 3.2 - 14 * PS < 0 ? y + r * 1.9 : y - r * 3.2}" text-anchor="middle" font-size="${(big ? 15 : 12) * PS}" font-weight="800" fill="#fff" stroke="#0d1126" stroke-width="${3 * PS}" paint-order="stroke" font-family="Nunito, sans-serif">${esc(label)}</text>` : ''}</g>`;
}
function mapSvg(v, overlay) {
  const m = M();
  let grid = '';
  if (v.mode === 'world') for (let lo = -150; lo <= 150; lo += 30) { const [x] = proj(0, lo); grid += `<path class="grid" d="M${x} 0V${m.h}"/>` }
  return `<svg id="map" viewBox="0 0 ${m.w} ${m.h}" role="img" aria-label="Harita"><rect width="${m.w}" height="${m.h}" fill="#0d2c4f"/>${grid}
    <path class="land" d="${m.others}"/><path class="tr" d="${m.turkey}"/>${overlay}</svg>`;
}
function ranking(v) { return v.players.slice().sort((a, b) => b.score - a.score || (a.km || 0) - (b.km || 0)) }

function render(v, ctx) {
  V = v; C = ctx;
  const me = ctx.me, P = v.players, mine = P.find(p => p.id === me);
  if (v.phase === 'lobby') {
    app.innerHTML = `<section class="panel">${Ati.shareHtml(ctx)}
      <div><span class="label">Oyuncular (2-8 kişi)</span><div class="row" style="margin-top:6px">${Ati.playersHtml(v, ctx)}</div></div>
      ${!mine ? '<p class="muted">Oyun başladı, izliyorsun.</p>' : ctx.isHost ? `
        <div class="row"><span class="label">Harita</span><span class="seg"><button data-m="tr" class="${mode === 'tr' ? 'on' : ''}">Türkiye (81 il)</button><button data-m="world" class="${mode === 'world' ? 'on' : ''}">Dünya (79 şehir)</button></span></div>
        <div class="row"><span class="label">Tur sayısı</span><span class="seg">${[8, 12, 16].map(n => `<button data-n="${n}" class="${count === n ? 'on' : ''}">${n}</button>`).join('')}</span></div>
        <button class="btn" id="start" ${P.length < 2 ? 'disabled' : ''}>Başlat</button>` : '<p class="muted">Ev sahibinin başlatması bekleniyor...</p>'}
      </section><section class="panel"><h2>Nasıl oynanır?</h2><p class="muted">Bir şehir adı gelir, haritada yerini işaretlersin. Türkiye modunda il merkezleri, dünya modunda başkentler ve büyük şehirler. Harita yazısız, sadece sınırlar var. Gerçek yere en yakın işaretleyen turu alır. Turlar eşitse toplam kilometresi az olan önde.</p></section>`;
    Ati.wireShare(app, ctx);
    app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { mode = b.dataset.m; render(V, C) });
    app.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { count = +b.dataset.n; render(V, C) });
    const s = app.querySelector('#start'); if (s) s.onclick = () => ctx.act({ type: 'start', mode, count });
    return;
  }
  if (v.phase === 'over') {
    const r = ranking(v);
    app.innerHTML = `<section class="panel"><span class="label">Oyun bitti</span><h2>${esc(r[0].name)} kazandı!</h2>
      <table><thead><tr><th>#</th><th>Oyuncu</th><th class="n">Kazandığı tur</th><th class="n">Ort. uzaklık</th></tr></thead>
      <tbody>${r.map((p, i) => `<tr><td>${i + 1}</td><td>${esc(p.name)}</td><td class="n">${p.score}</td><td class="n">${fmtKm(Math.round((p.km || 0) / v.qs.length))}</td></tr>`).join('')}</tbody></table>
      ${ctx.isHost ? '<button class="btn" id="again">Tekrar oyna</button><button class="btn ghost" id="lobby2" style="margin-left:8px">Harita değiştir</button>' : '<p class="muted">Ev sahibi yeni oyun başlatabilir.</p>'}</section>`;
    const g = app.querySelector('#again'); if (g) g.onclick = () => ctx.act({ type: 'start', mode: v.mode, count: v.qs.length });
    const l = app.querySelector('#lobby2'); if (l) l.onclick = () => ctx.act({ type: 'start', mode: v.mode === 'tr' ? 'world' : 'tr', count: v.qs.length });
    return;
  }
  const city = M().cities[v.qs[v.cur]], key = v.mode + v.cur + ':' + v.qs[v.cur];
  if (v.phase === 'q' && key !== qKey) { qKey = key; deadline = performance.now() + v.left; pick = null }
  if (ctx.isHost && v.phase === 'q' && timerFor !== key) { timerFor = key; const cur = v.cur; setTimeout(() => ctx.act({ type: 'timeout', cur }), v.left + 80) }
  const done = mine && (me in v.ans);
  PS = Math.max(1, M().w / (Math.max(280, (app.clientWidth || 600) - 44) * (zoom ? 2.2 : 1)));
  let overlay = '', below = '';
  if (v.phase === 'q') {
    if (done && v.ans[me] !== 'x') { const [x, y] = proj(v.ans[me].lat, v.ans[me].lon); overlay = pinSvg(x, y, col(P.indexOf(mine)), 'Sen') }
    else if (pick) { const [x, y] = proj(pick.lat, pick.lon); overlay = pinSvg(x, y, col(P.indexOf(mine)), '') }
    below = `${mine && !done ? `<div class="acts"><button class="btn" id="lock" ${pick ? '' : 'disabled'}>Buraya kilitle</button><span class="muted">${pick ? 'Değiştirmek için haritada başka yere dokun.' : 'Haritada yerini işaretle.'}</span></div>` : mine ? '<p><strong>İşaretin kilitlendi.</strong> Diğerleri bekleniyor...</p>' : ''}
      <div class="ppl">${P.map(p => `<span class="${p.id in v.ans ? 'ok' : ''}">${esc(p.name)} ${p.id in v.ans ? '✓' : '…'}</span>`).join('')}</div>`;
  } else {
    const [tx, ty] = proj(city[1], city[2]);
    P.forEach((p, i) => { const a = v.ans[p.id]; if (!a) return; const [x, y] = proj(a.lat, a.lon); overlay += `<line x1="${x}" y1="${y}" x2="${tx}" y2="${ty}" stroke="${col(i)}" stroke-width="${2 * PS}" stroke-dasharray="${5 * PS} ${4 * PS}" opacity=".85"/>` });
    P.forEach((p, i) => { const a = v.ans[p.id]; if (!a) return; const [x, y] = proj(a.lat, a.lon); overlay += pinSvg(x, y, col(i), p.name) });
    overlay += `<circle cx="${tx}" cy="${ty}" r="${16 * PS}" fill="none" stroke="#ffc83d" stroke-width="${3 * PS}"><animate attributeName="r" values="${10 * PS};${22 * PS};${10 * PS}" dur="1.6s" repeatCount="indefinite"/></circle>` + pinSvg(tx, ty, '#ffc83d', city[0], true);
    const rows = P.map((p, i) => ({ p, i, d: v.dist[p.id] })).sort((a, b) => (a.d ?? 1e9) - (b.d ?? 1e9));
    below = `<div class="rows">${rows.map(o => `<div class="rw ${v.win.includes(o.p.id) ? 'win' : ''}" style="--c:${col(o.i)}"><i></i><span>${esc(o.p.name)}${v.win.includes(o.p.id) ? ' <span class="crown">+1</span>' : ''}</span><b>${o.d != null ? fmtKm(o.d) + ' uzakta' : 'işaret yok'}</b></div>`).join('')}</div>
      <button class="btn" id="next">${v.cur + 1 >= v.qs.length ? 'Sonuçları gör' : 'Sonraki şehir'}</button>`;
  }
  const sc = app.querySelector('.mapbox') ? [app.querySelector('.mapbox').scrollLeft, app.querySelector('.mapbox').scrollTop] : [0, 0];
  app.innerHTML = `<div class="row">${ranking(v).map(p => `<span class="pill">${esc(p.name)} · ${p.score}</span>`).join('')}</div>
    <section class="panel"><div class="topline"><span class="pill">${v.mode === 'tr' ? 'Türkiye' : 'Dünya'} · Tur ${v.cur + 1}/${v.qs.length}</span>${v.phase === 'q' ? '<span class="sec" id="tsec"></span>' : ''}</div>
      ${v.phase === 'q' ? '<div class="bar"><i id="tbar"></i></div>' : ''}
      <div class="q">${v.mode === 'tr' ? '' : ''}<b>${esc(city[0])}</b> nerede?</div>
      <div class="mapbox ${zoom ? 'zoom' : ''}">${mapSvg(v, overlay)}</div>
      <div class="acts"><button class="btn ghost small" id="zm">${zoom ? 'Küçült' : 'Haritayı büyüt'}</button></div>
      ${below}</section>`;
  const mb = app.querySelector('.mapbox'); mb.scrollLeft = sc[0]; mb.scrollTop = sc[1];
  const svg = document.getElementById('map');
  if (v.phase === 'q' && mine && !done) svg.addEventListener('click', e => {
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    pick = unproj(p.x, p.y); render(V, C);
  });
  const lk = app.querySelector('#lock'); if (lk) lk.onclick = () => { if (pick) ctx.act({ type: 'answer', lat: pick.lat, lon: pick.lon }) };
  app.querySelector('#zm').onclick = () => { zoom = !zoom; render(V, C) };
  const n = app.querySelector('#next'); if (n) n.onclick = () => ctx.act({ type: 'next' });
  if (v.phase === 'q' && !raf) raf = requestAnimationFrame(tick);
}
Ati.start({ game: 'harita', el: app, logic: Harita, render });
</script>
</body>
</html>
