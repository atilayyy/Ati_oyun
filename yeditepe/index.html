<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yedi Tepe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Nunito:wght@400;600;800&display=swap">
<link rel="stylesheet" href="../assets/style.css">
<style>
.wrap{max-width:1180px}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:980px){.layout{grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);align-items:start}}
.boardbox{border-radius:20px;overflow:hidden;background:#0f3a63;box-shadow:0 0 0 3px #b8902e,0 0 0 6px #1a2047,0 10px 30px rgba(0,0,0,.45)}
svg.sky{display:block;width:100%;height:auto}
svg.map{display:block;width:100%;height:auto;touch-action:manipulation}
.hex text{pointer-events:none;font-family:var(--body)}
.tn{font-family:var(--display)!important;font-weight:800;font-size:19px;text-anchor:middle;dominant-baseline:central;fill:#1b1f33}
.tn.red{fill:#b42318}
.pip{fill:#1b1f33}.pip.red{fill:#b42318}
.hname{font-size:10px;font-weight:800;text-anchor:middle;fill:#fff;paint-order:stroke;stroke:rgba(10,14,35,.75);stroke-width:3.2px;letter-spacing:.02em}
.hem{font-size:11px;text-anchor:middle;dominant-baseline:central}
.robber{pointer-events:none}
.robber text{font-size:17px;text-anchor:middle;dominant-baseline:central}
.rring{fill:none;stroke:#ff5a4f;stroke-width:3;animation:rring 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rring{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.road{stroke-linecap:round;stroke-width:8}
.roadb{stroke:#1b1f33;stroke-linecap:round;stroke-width:12}
.roadc{stroke:rgba(255,255,255,.4);stroke-width:1.6;stroke-dasharray:2.5 3.5;stroke-linecap:round}
.port line{stroke:#6b4423;stroke-width:6;stroke-linecap:round}
.port line.plank{stroke:#b8834f;stroke-width:3;stroke-dasharray:3 2}
.port circle{fill:#1a2047;stroke:#e9c46a;stroke-width:2}
.port circle.pin{fill:none;stroke:#e9c46a;stroke-width:.8;opacity:.6}
.port text{font-size:10.5px;font-weight:800;text-anchor:middle;dominant-baseline:central;fill:#ffe8a3}
.wavesg{animation:waves 14s linear infinite}
@keyframes waves{to{transform:translateX(60px)}}
.fer1,.fer2{animation-name:sail;animation-timing-function:linear;animation-iteration-count:infinite}
.fer2{animation-name:sail2}
@keyframes sail{from{transform:translateX(-360px)}to{transform:translateX(360px)}}
@keyframes sail2{from{transform:translateX(360px)}to{transform:translateX(-360px)}}
.gull{animation:gull 3s ease-in-out infinite}.gull.g2{animation-delay:-1.4s}
@keyframes gull{50%{transform:translateY(-4px)}}
.mill{animation:mill 12s linear infinite}
@keyframes mill{to{transform:rotate(360deg)}}
.jet{animation:jet 1.8s ease-in-out infinite}
@keyframes jet{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.wavesg,.fer1,.fer2,.gull,.mill,.jet,.rring{animation:none}}
.tgt-v{fill:rgba(255,255,255,.85);stroke:#ffd23f;stroke-width:3;cursor:pointer;animation:pulse 1.2s ease-in-out infinite}
.tgt-e{stroke:rgba(255,210,63,.9);stroke-width:11;stroke-linecap:round;stroke-dasharray:4 6;cursor:pointer;animation:pulse 1.2s ease-in-out infinite}
.tgt-e-hit{stroke:transparent;stroke-width:26;cursor:pointer}
.tgt-v-hit{fill:transparent;cursor:pointer}
.tgt-v{pointer-events:none}
.tgt-h{fill:rgba(255,210,63,.22);stroke:#ffd23f;stroke-width:4;cursor:pointer}
.tgt-h:hover{fill:rgba(255,210,63,.4)}
@keyframes pulse{50%{opacity:.45}}
.hexhit{fill:transparent;cursor:pointer}
.status{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.status .who{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.05rem}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;border:2px solid #1b1f33;flex:none}
.dice{display:flex;gap:6px;margin-left:auto}
.die{width:42px;height:42px;border-radius:10px;background:linear-gradient(145deg,#fffaf0,#e8dcc0);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:6px;box-shadow:0 4px 0 #b8902e,0 6px 10px rgba(0,0,0,.4);}
.die.anim{animation:roll .5s ease-out}
.die i{width:7px;height:7px;border-radius:50%;background:#1b1f33;place-self:center}
.die.seven{background:linear-gradient(145deg,#ffe0e0,#f2b8b8)}
.die.seven i{background:#b42318}
@keyframes roll{0%{transform:rotate(-200deg) scale(.6)}100%{transform:none}}
.hint{font-weight:700;color:var(--accent)}
.hand{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rc{border-radius:12px;padding:9px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;box-shadow:0 0 0 1.5px rgba(233,196,106,.7) inset,0 4px 0 rgba(0,0,0,.35);background-image:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,0) 45%,rgba(0,0,0,.18));text-shadow:0 1px 2px rgba(0,0,0,.4)}
.rc .e{font-size:1.4rem;line-height:1}
.rc .n{font-family:var(--display);font-weight:800;font-size:1.4rem;line-height:1}
.rc .l{font-size:.68rem;font-weight:800;opacity:.9}
.rc.zero{opacity:.4}
.r-kereste{background-color:#2f7d4a}.r-tugla{background-color:#b5563a}.r-kumas{background-color:#8e3b74}.r-bugday{background-color:#c99a1f}.r-mermer{background-color:#6b7180}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.ab{font:inherit;text-align:left;padding:9px 10px;border-radius:12px;border:2px solid var(--edge);background:var(--table);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.ab b{font-size:.95rem}
.ab small{font-size:.75rem;color:var(--muted)}
.ab:disabled{opacity:.4;cursor:default}
.ab.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,var(--table))}
.ab.main{background:var(--accent);color:var(--accentink);border-color:var(--accent)}
.ab.main small{color:var(--accentink);opacity:.8}
.devs{display:flex;flex-direction:column;gap:6px}
.dv{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--table)}
.dv .t{flex:1;display:flex;flex-direction:column}
.dv .t small{color:var(--muted)}
.box{border:2px solid var(--accent);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;border-radius:10px;background:var(--table)}
.st .e{font-size:1.2rem}
.st .v{font-family:var(--display);font-weight:800;font-size:1.2rem}
.st .pm{display:flex;gap:4px}
.st button{width:28px;height:28px;border-radius:8px;border:1px solid var(--edge);background:var(--table2);color:var(--ink);font:800 1rem var(--body);cursor:pointer}
.st button:disabled{opacity:.3}
.rpick{display:flex;gap:6px;flex-wrap:wrap}
.rpick button{font:inherit;font-weight:800;padding:8px 10px;border-radius:10px;border:2px solid var(--edge);background:var(--table);color:var(--ink);cursor:pointer}
.rpick button.on{border-color:var(--accent)}
.rpick button:disabled{opacity:.35}
.ppl{display:flex;flex-direction:column;gap:6px}
.pp{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--table);border:2px solid transparent}
.pp.turn{border-color:var(--accent)}
.pp .vp{font-family:var(--display);font-weight:800;font-size:1.5rem}
.pp .meta{grid-column:2/4;display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);font-weight:700}
.badge{font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--accentink)}
.log{display:flex;flex-direction:column;gap:3px;font-size:.86rem;color:var(--muted);max-height:220px;overflow:auto}
.cost{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.88rem}
.info{font-size:.9rem}
.stoast{font-weight:800;color:var(--accent);margin:0}
details.panel summary{cursor:pointer;font-weight:800}
.rules{font-size:.92rem;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.rules b{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="home" href="../">ATI <b>OYUN</b></a><h1>Yedi Tepe</h1></div>
  <main id="app"></main>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="../assets/ek.js"></script>
<script src="../assets/net.js"></script>
<script src="board.js"></script>
<script src="logic.js"></script>
<script>
const app = document.getElementById('app'), esc = Ati.esc, L = YediTepe;
const { RES, RN, RE, HEX, VERT, EDGE, COST, TERRAIN, DEV } = YT;
let V, C, mode = null, tradeOpen = false, tg = {}, tw = {}, bankGive = null, bankGet = null, disc = {}, pickR = [], info = null, uiKey = '';
const nm = id => (V.players.find(p => p.id === id) || {}).name || '?';
const col = id => V.colors[id];
const costTxt = c => Object.entries(c).map(([r, n]) => `${n}${RE[r]}`).join(' ');
const zero = () => ({ kereste: 0, tugla: 0, kumas: 0, bugday: 0, mermer: 0 });

const RULES = `<div class="rules">
<p><b>Amaç:</b> ilk 10 puana ulaşmak. Ev 1, konak 2, En Uzun Yol 2, En Büyük Ordu 2, Zafer Puanı kartı 1 puan.</p>
<p><b>Kurulum:</b> sırayla 1 ev + 1 yol, sonra ters sırayla 1 ev + 1 yol daha. İkinci evin değdiği yerlerden birer kaynak alırsın. Evler arasında en az 2 yol mesafe olmalı.</p>
<p><b>Sıran gelince:</b> zar at. Zardaki sayının yazdığı yerlere değen herkes kaynak alır (ev 1, konak 2). Sonra ticaret yap, inşa et, turu bitir.</p>
<p><b>7 gelirse:</b> elinde 7'den fazla kart olan yarısını atar. Zar atan Zabıta'yı başka bir yere taşır, o yer üretmez. Oraya değen birinden rastgele 1 kart çalar.</p>
<p><b>Ticaret:</b> diğer oyunculara teklif verebilirsin, ya da bankayla 4'e 1. Limana ev kurarsan 3'e 1 ya da o kaynakta 2'ye 1.</p>
<p><b>Fırsat kartları:</b> Yeniçeri (Zabıta'yı taşı, kart çal), Yol Yapımı (2 bedava yol), Bereket (bankadan 2 kaynak), Tekel (herkesten bir kaynağın tamamı), Zafer Puanı. Turda 1 kart oynanır, aldığın turda oynayamazsın. 3+ Yeniçeri oynayan En Büyük Ordu'yu alır.</p>
<p><b>En Uzun Yol:</b> 5+ kesintisiz yol. Rakibin evi yolunu böler.</p></div>`;

/* ---- harita çizimi ---- */
// her altıgen için sabit rastgelelik: süsler oyun boyunca yerinde durur
const hrand = (i, k) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x) };
const SLOTS = [[-34, -12], [-34, 10], [34, -12], [34, 10], [-19, -31], [19, -31], [-21, 21], [21, 21]];
const darker = (hex, f) => { const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255; return `rgb(${Math.round(r * f)},${Math.round(g * f)},${Math.round(b * f)})` };
function art(t, x, y, i) {
  let o = '';
  const at = (k) => [x + SLOTS[k][0] + (hrand(i, k) - .5) * 5, y + SLOTS[k][1] + (hrand(i, k + 9) - .5) * 4];
  if (t === 'kereste') {
    for (let k = 0; k < 8; k++) {
      const [a, b] = at(k), cyp = hrand(i, k + 20) > .45;
      o += cyp
        ? `<rect x="${a - 1}" y="${b + 7}" width="2" height="4" fill="#4a2e1a"/><ellipse cx="${a}" cy="${b - 2}" rx="5.2" ry="12" fill="#163f26"/><ellipse cx="${a - 1.5}" cy="${b - 4}" rx="2" ry="8" fill="#2d6e43" opacity=".8"/>`
        : `<rect x="${a - 1.2}" y="${b + 3}" width="2.4" height="6" fill="#4a2e1a"/><circle cx="${a}" cy="${b - 1}" r="8.5" fill="#1d5a33"/><circle cx="${a - 2.5}" cy="${b - 3.5}" r="4" fill="#3c8a55"/>`;
    }
  } else if (t === 'tugla') {
    o += `<rect x="${x - 60}" y="${y - 60}" width="120" height="120" fill="url(#bricks)" opacity=".55"/>`;
    const [a, b] = at(2);
    o += `<rect x="${a - 5}" y="${b - 18}" width="10" height="26" fill="#6b2a17" stroke="#3a160b" stroke-width="1"/><rect x="${a - 7}" y="${b - 20}" width="14" height="4" fill="#3a160b"/>
      <circle cx="${a + 3}" cy="${b - 27}" r="5" fill="#d8d2c8" opacity=".7"/><circle cx="${a + 8}" cy="${b - 35}" r="6.5" fill="#d8d2c8" opacity=".5"/><circle cx="${a + 14}" cy="${b - 44}" r="8" fill="#d8d2c8" opacity=".3"/>`;
    for (const k of [1, 6]) { const [c, d] = at(k); o += `<g fill="#c9683f" stroke="#5b2312" stroke-width=".8"><rect x="${c - 9}" y="${d}" width="8" height="4"/><rect x="${c - 1}" y="${d}" width="8" height="4"/><rect x="${c - 5}" y="${d - 4}" width="8" height="4"/></g>` }
  } else if (t === 'kumas') {
    for (const k of [0, 2, 4, 5, 6, 7]) {
      const [a, b] = at(k);
      o += `<rect x="${a - 9}" y="${b - 1}" width="18" height="9" fill="#f1dcae" stroke="#5a2147" stroke-width=".8"/><path d="M${a - 8} ${b - 1}a8 8 0 0 1 16 0z" fill="#e9b949" stroke="#7a5410" stroke-width=".8"/><rect x="${a - .6}" y="${b - 12}" width="1.2" height="4" fill="#7a5410"/>
        <path d="M${a - 6} ${b + 8}v-4a2 2 0 0 1 4 0v4M${a + 2} ${b + 8}v-4a2 2 0 0 1 4 0v4" fill="#5a2147"/>`;
    }
    const [a, b] = at(1); o += `<path d="M${a - 11} ${b - 4}h22l-3 7h-16z" fill="url(#awn)"/>`;
    const [c, d] = at(3); o += `<rect x="${c - 8}" y="${d - 6}" width="16" height="11" rx="1" fill="#b23a48"/><rect x="${c - 6}" y="${d - 4}" width="12" height="7" fill="none" stroke="#f1dcae" stroke-width="1"/><circle cx="${c}" cy="${d - .5}" r="1.6" fill="#e9b949"/>`;
  } else if (t === 'bugday') {
    o += `<rect x="${x - 60}" y="${y - 60}" width="120" height="120" fill="url(#rows)" opacity=".6"/>`;
    for (const k of [0, 1, 3, 4, 6, 7]) {
      const [a, b] = at(k);
      o += `<g stroke="#8a5a0b" stroke-width="1.2" stroke-linecap="round"><path d="M${a} ${b + 9}V${b - 6}M${a - 4} ${b + 9}l2-14M${a + 4} ${b + 9}l-2-14"/></g><g fill="#f7d66b">${[-6, -2, 2].map(dy => `<ellipse cx="${a}" cy="${b + dy}" rx="1.8" ry="2.6"/><ellipse cx="${a - 3}" cy="${b + dy + 1}" rx="1.6" ry="2.4"/><ellipse cx="${a + 3}" cy="${b + dy + 1}" rx="1.6" ry="2.4"/>`).join('')}</g>`;
    }
    const [a, b] = at(2);
    o += `<path d="M${a - 5} ${b + 10}l2-16h6l2 16z" fill="#f4ead2" stroke="#6b4a1a" stroke-width="1"/><path d="M${a - 6} ${b - 6}l6-6 6 6z" fill="#9b3b2b"/>
      <g stroke="#6b4a1a" stroke-width="2" stroke-linecap="round" class="mill" style="transform-origin:${a}px ${b - 4}px;animation-delay:-${(performance.now() / 1000 % 12).toFixed(2)}s"><path d="M${a} ${b - 4}l-11 -9M${a} ${b - 4}l11 9M${a} ${b - 4}l9 -11M${a} ${b - 4}l-9 11"/></g>`;
  } else if (t === 'mermer') {
    const peak = (a, b, w, hgt) => `<path d="M${a - w} ${b + hgt * .45}L${a} ${b - hgt * .55}L${a + w} ${b + hgt * .45}z" fill="#5d6577" stroke="#3a4050" stroke-width="1"/><path d="M${a} ${b - hgt * .55}L${a + w} ${b + hgt * .45}H${a + w * .2}z" fill="#4b5263"/><path d="M${a - w * .33} ${b - hgt * .22}L${a} ${b - hgt * .55}L${a + w * .33} ${b - hgt * .22}l-${w * .16} ${hgt * .06}l-${w * .17} -${hgt * .07}l-${w * .17} ${hgt * .08}z" fill="#f4f1ea"/>`;
    { const [a, b] = at(0); o += peak(a + 4, b, 16, 30) }
    { const [a, b] = at(3); o += peak(a - 4, b - 4, 14, 26) }
    { const [a, b] = at(5); o += peak(a, b + 4, 11, 20) }
    for (const k of [6, 7]) { const [a, b] = at(k); o += `<rect x="${a - 7}" y="${b - 4}" width="14" height="9" fill="#ece7dc" stroke="#9aa0ad" stroke-width=".8"/><path d="M${a - 6} ${b - 1}q4 3 7 -1t5 2" stroke="#9aa0ad" stroke-width=".7" fill="none"/>` }
  } else {
    o += `<rect x="${x - 60}" y="${y - 60}" width="120" height="120" fill="url(#cobble)" opacity=".7"/>
      <ellipse cx="${x}" cy="${y + 8}" rx="24" ry="9" fill="#5b8fb0" stroke="#e7dcc0" stroke-width="3"/><ellipse cx="${x}" cy="${y + 6}" rx="17" ry="5" fill="#8ec6e0"/>
      <rect x="${x - 3}" y="${y - 16}" width="6" height="20" fill="#e7dcc0" stroke="#8a7a58" stroke-width=".8"/><ellipse cx="${x}" cy="${y - 17}" rx="8" ry="3" fill="#e7dcc0" stroke="#8a7a58" stroke-width=".8"/>
      <path class="jet" d="M${x} ${y - 19}q-7 -10 -12 4M${x} ${y - 19}q7 -10 12 4" stroke="#bfe6f5" stroke-width="2" fill="none" stroke-linecap="round"/>`;
    for (const k of [4, 5]) { const [a, b] = at(k); o += `<g fill="#1f6b3a"><circle cx="${a}" cy="${b}" r="6"/></g><rect x="${a - 1}" y="${b + 5}" width="2" height="4" fill="#4a2e1a"/>` }
  }
  return o;
}
function house(x, y, c) {
  return `<g class="bld"><ellipse cx="${x}" cy="${y + 9}" rx="11" ry="3" fill="rgba(0,0,0,.35)"/>
    <rect x="${x - 9}" y="${y - 3}" width="18" height="12" fill="${c}" stroke="#1b1f33" stroke-width="1.6"/>
    <path d="M${x - 12} ${y - 2}L${x} ${y - 14}L${x + 12} ${y - 2}z" fill="${darker(c.length === 7 ? c : '#888888', .62)}" stroke="#1b1f33" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M${x - 8} ${y - 4}L${x} ${y - 12}" stroke="rgba(255,255,255,.45)" stroke-width="1.2"/>
    <rect x="${x - 2.5}" y="${y + 2}" width="5" height="7" rx="2.5" fill="#1b1f33"/><rect x="${x + 4}" y="${y}" width="3" height="3" fill="#ffe8a3"/></g>`;
}
function konak(x, y, c) {
  const d = darker(c, .62);
  return `<g class="bld"><ellipse cx="${x}" cy="${y + 11}" rx="18" ry="3.5" fill="rgba(0,0,0,.35)"/>
    <rect x="${x - 17}" y="${y - 12}" width="5" height="22" fill="${c}" stroke="#1b1f33" stroke-width="1.4"/><path d="M${x - 18} ${y - 12}l3.5 -9 3.5 9z" fill="${d}" stroke="#1b1f33" stroke-width="1.2"/>
    <rect x="${x + 12}" y="${y - 12}" width="5" height="22" fill="${c}" stroke="#1b1f33" stroke-width="1.4"/><path d="M${x + 11} ${y - 12}l3.5 -9 3.5 9z" fill="${d}" stroke="#1b1f33" stroke-width="1.2"/>
    <rect x="${x - 13}" y="${y - 3}" width="26" height="13" fill="${c}" stroke="#1b1f33" stroke-width="1.6"/>
    <path d="M${x - 10} ${y - 3}a10 10 0 0 1 20 0z" fill="${d}" stroke="#1b1f33" stroke-width="1.6"/><path d="M${x - 6} ${y - 6}a6 6 0 0 1 5 -4" stroke="rgba(255,255,255,.5)" stroke-width="1.3" fill="none"/>
    <rect x="${x - .8}" y="${y - 17}" width="1.6" height="5" fill="#e9c46a"/><circle cx="${x}" cy="${y - 18}" r="1.6" fill="#e9c46a"/>
    <path d="M${x - 9} ${y + 10}v-5a2 2 0 0 1 4 0v5M${x - 2} ${y + 10}v-6a2 2 0 0 1 4 0v6M${x + 5} ${y + 10}v-5a2 2 0 0 1 4 0v5" fill="#1b1f33"/>
    <rect x="${x - 13}" y="${y - 3}" width="26" height="2" fill="#e9c46a" opacity=".85"/></g>`;
}
function star8(x, y, r) {
  const pts = []; for (let i = 0; i < 16; i++) { const a = Math.PI / 8 * i, rr = i % 2 ? r * .45 : r; pts.push((x + rr * Math.cos(a)).toFixed(1) + ',' + (y + rr * Math.sin(a)).toFixed(1)) }
  return `<polygon points="${pts.join(' ')}" fill="#e9c46a" stroke="#7a5410" stroke-width="1"/><circle cx="${x}" cy="${y}" r="${r * .22}" fill="#1a4c7a"/>`;
}
function ferry(cls, y, dur, flip, color) {

      <button class="ab main" id="end"><b>Turu bitir</b><small>Sıra sonrakine</small></button>`;
    box = `<div class="acts">${acts}</div>`;
    // fırsat kartı oynama
    const pick = pickR.length;
    if (playable.length) box += `<div><span class="label">Oynanabilir fırsat kartları</span><div class="rpick" style="margin-top:6px">${[...new Set(playable.map(c => c.k))].map(k => `<button data-play="${k}">${DEV[k].em} ${DEV[k].name}</button>`).join('')}</div></div>`;
    if (mode === 'bereket') box += `<div class="box"><b>Bereket: bankadan 2 kaynak seç (${pick}/2)</b><div class="rpick">${RES.map(r => `<button data-pr="${r}" ${v.bank[r] ? '' : 'disabled'}>${RE[r]} ${RN[r]}</button>`).join('')}</div><div class="muted">${pickR.map(r => RE[r]).join(' ')}</div>
      <div class="row"><button class="btn" id="okber" ${pick === 2 ? '' : 'disabled'}>Al</button><button class="btn ghost small" id="cx">Vazgeç</button></div></div>`;
    if (mode === 'tekel') box += `<div class="box"><b>Tekel: herkesten toplayacağın kaynağı seç</b><div class="rpick">${RES.map(r => `<button data-tek="${r}">${RE[r]} ${RN[r]}</button>`).join('')}</div><button class="btn ghost small" id="cx">Vazgeç</button></div>`;
    // ticaret
    if (v.sub === 'main' && (tradeOpen || v.trade)) {
      if (v.trade) {
        const T = v.trade, yes = Object.keys(T.resp).filter(id => T.resp[id] === 'yes');
        box += `<div class="box"><b>Teklifin: ${costTxt(T.give)} ver ↔ ${costTxt(T.get)} al</b>
          <div>${v.order.filter(id => id !== me).map(id => `<div>${esc(nm(id))}: ${T.resp[id] === 'yes' ? '✅ kabul' : T.resp[id] === 'no' ? '❌ red' : '… düşünüyor'}</div>`).join('')}</div>
          <div class="row">${yes.map(id => `<button class="btn" data-conf="${esc(id)}">${esc(nm(id))} ile takas et</button>`).join('')}<button class="btn ghost small" id="cancelT">Teklifi geri çek</button></div></div>`;
      } else {
        const ng = RES.reduce((a, r) => a + (tg[r] || 0), 0), nw = RES.reduce((a, r) => a + (tw[r] || 0), 0);
        const rate = v.rates;
        box += `<div class="box"><b>Oyunculara teklif</b><span class="label">Veriyorum</span>${stepper(tg, r => h[r], 'g')}<span class="label">İstiyorum</span>${stepper(tw, () => 19, 'w')}
          <button class="btn" id="offer" ${ng && nw ? '' : 'disabled'}>Teklif et</button>
          <hr style="border:0;border-top:1px solid var(--edge);width:100%">
          <b>Bankayla takas (limanların sayılır)</b>
          <span class="label">Ver</span><div class="rpick">${RES.map(r => `<button data-bg="${r}" class="${bankGive === r ? 'on' : ''}" ${h[r] >= rate[r] ? '' : 'disabled'}>${rate[r]} ${RE[r]}</button>`).join('')}</div>
          <span class="label">Al</span><div class="rpick">${RES.map(r => `<button data-bw="${r}" class="${bankGet === r ? 'on' : ''}" ${v.bank[r] && r !== bankGive ? '' : 'disabled'}>1 ${RE[r]}</button>`).join('')}</div>
          <button class="btn" id="bank" ${bankGive && bankGet && bankGive !== bankGet && h[bankGive] >= rate[bankGive] ? '' : 'disabled'}>Takas et</button></div>`;
      }
    }
  } else if (inGame && v.trade && v.sub === 'main' && v.trade.from !== me) {
    const T = v.trade, r = T.resp[me];
    box = `<div class="box"><b>${esc(nm(T.from))} takas teklif ediyor:</b><span>Sana ${costTxt(T.give)} veriyor, karşılığında ${costTxt(T.get)} istiyor.</span>
      ${r ? `<span class="muted">${r === 'yes' ? 'Kabul ettin, onun seçmesi bekleniyor.' : 'Reddettin.'}</span>` : `<div class="row"><button class="btn" id="tyes" ${L.canPay(h, T.get) ? '' : 'disabled'}>Kabul</button><button class="btn ghost" id="tno">Reddet</button></div>`}</div>`;
  }

  // fırsat kartlarım
  const myDev = inGame && v.dev[me] && v.dev[me].length ? `<section class="panel"><span class="label">Fırsat kartların</span><div class="devs">${v.dev[me].map(c => `<div class="dv"><span style="font-size:1.4rem">${DEV[c.k].em}</span><div class="t"><b>${c.k === 'puan' ? esc(c.n || 'Zafer Puanı') + ' (+1 puan)' : DEV[c.k].name}</b><small>${DEV[c.k].desc}${c.t >= v.turnNo && c.k !== 'puan' ? ' · bu tur aldın, sonraki turda oynanır' : ''}</small></div></div>`).join('')}</div></section>` : '';
  const infoHtml = info != null ? (() => { const hx = v.hexes[info]; return `<p class="info"><b>${esc(v.names[info])}</b>: ${hx.t === 'col' ? 'üretim yok' : RE[hx.t] + ' ' + RN[hx.t] + ', zar ' + hx.n}${info === v.robber ? ' · 🚨 Zabıta burada' : ''}</p>` })() : '';

  app.innerHTML = `<div class="layout"><div>
      <section class="panel"><div class="status"><span class="who"><span class="dot" style="background:${col(turnId)}"></span>${v.phase === 'over' ? 'Oyun bitti' : esc(nm(turnId)) + (myTurn ? ' (sen)' : '')}</span>${dice}</div><p class="hint" style="margin:0">${hint}</p>${steal}</section>
      <div class="boardbox">${SKYLINE}${boardSvg(v, me)}</div>${infoHtml}
    </div><div style="display:flex;flex-direction:column;gap:14px">
      ${box ? `<section class="panel">${box}</section>` : ''}
      ${inGame ? `<section class="panel"><span class="label">Elin · ${v.vp[me]} puan</span>${handHtml(h)}</section>` : ''}
      ${myDev}
      <section class="panel"><span class="label">Oyuncular · puan</span>${playersHtml(v, me)}</section>
      <details class="panel"><summary>Maliyetler ve kurallar</summary><div class="cost" style="margin-top:8px"><span>🛣️ Yol</span><span>${costTxt(COST.yol)}</span><span>🏠 Ev (1 puan)</span><span>${costTxt(COST.ev)}</span><span>🏰 Konak (2 puan)</span><span>${costTxt(COST.konak)}</span><span>📜 Fırsat kartı</span><span>${costTxt(COST.kart)}</span></div>${RULES}</details>
      <section class="panel"><span class="label">Olanlar</span><div class="log">${v.log.slice().reverse().map(l => `<span>${esc(l)}</span>`).join('')}</div></section>
    </div></div>`;
  wire(v, me);
}

function wire(v, me) {
  const ctx = C, A = a => ctx.act(a), on = (s, f) => { const b = app.querySelector(s); if (b) b.onclick = f };
  app.querySelectorAll('[data-v]').forEach(el => el.onclick = () => {
    const k = +el.dataset.v;
    if (v.phase === 'setup') A({ type: 'place', v: k }); else { A({ type: 'build', k: mode, v: k }); mode = null }
  });
  app.querySelectorAll('[data-e]').forEach(el => el.onclick = () => {
    const e = +el.dataset.e;
    if (v.phase === 'setup' || v.sub === 'roads') A({ type: 'road', e }); else { A({ type: 'build', k: 'yol', e }); mode = null }
  });
  app.querySelectorAll('[data-h]').forEach(el => el.onclick = () => A({ type: 'robber', h: +el.dataset.h }));
  app.querySelectorAll('[data-info]').forEach(el => el.onclick = () => { info = info === +el.dataset.info ? null : +el.dataset.info; render(V, C) });
  app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { mode = mode === b.dataset.mode ? null : b.dataset.mode; tradeOpen = false; render(V, C) });
  app.querySelectorAll('[data-steal]').forEach(b => b.onclick = () => A({ type: 'steal', id: b.dataset.steal }));
  app.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
    const [k, r, d] = b.dataset.s.split(':'), o = k === 'd' ? disc : k === 'g' ? tg : tw;
    o[r] = Math.max(0, (o[r] || 0) + +d); if (k === 'g' && o[r]) tw[r] = 0; if (k === 'w' && o[r]) tg[r] = 0; render(V, C);
  });
  app.querySelectorAll('[data-play]').forEach(b => b.onclick = () => {
    const k = b.dataset.play;
    if (k === 'bereket' || k === 'tekel') { mode = k; pickR = []; render(V, C) } else A({ type: 'play', k });
  });
  app.querySelectorAll('[data-pr]').forEach(b => b.onclick = () => { if (pickR.length < 2) pickR.push(b.dataset.pr); else pickR = [b.dataset.pr]; render(V, C) });
  app.querySelectorAll('[data-tek]').forEach(b => b.onclick = () => { A({ type: 'play', k: 'tekel', r: b.dataset.tek }); mode = null });
  on('#okber', () => { A({ type: 'play', k: 'bereket', r1: pickR[0], r2: pickR[1] }); mode = null; pickR = [] });
  on('#cx', () => { mode = null; pickR = []; render(V, C) });
  app.querySelectorAll('[data-bg]').forEach(b => b.onclick = () => { bankGive = b.dataset.bg; if (bankGet === bankGive) bankGet = null; render(V, C) });
  app.querySelectorAll('[data-bw]').forEach(b => b.onclick = () => { bankGet = b.dataset.bw; render(V, C) });
  app.querySelectorAll('[data-conf]').forEach(b => b.onclick = () => A({ type: 'confirm', id: b.dataset.conf }));
  on('#roll', () => A({ type: 'roll' }));
  on('#end', () => { tradeOpen = false; mode = null; A({ type: 'end' }) });
  on('#buydev', () => A({ type: 'build', k: 'kart' }));
  on('#trade', () => { tradeOpen = !tradeOpen; mode = null; render(V, C) });
  on('#offer', () => { A({ type: 'offer', give: tg, get: tw }); tg = {}; tw = {} });
  on('#cancelT', () => A({ type: 'cancelTrade' }));
  on('#bank', () => { A({ type: 'bank', give: bankGive, get: bankGet }); bankGive = bankGet = null });
  on('#disc', () => { A({ type: 'discard', cards: Object.assign(zero(), disc) }); disc = {} });
  on('#endfree', () => A({ type: 'endfree' }));
  on('#tyes', () => A({ type: 'respond', ok: true }));
  on('#tno', () => A({ type: 'respond', ok: false }));
  on('#again', () => A({ type: 'start' }));
}
Ati.start({ game: 'yeditepe', el: app, logic: YediTepe, render });
</script>
</body>
</html>
