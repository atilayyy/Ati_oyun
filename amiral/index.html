<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Amiral Battı</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Nunito:wght@400;600;800&display=swap">
<link rel="stylesheet" href="../assets/style.css">
<style>
:root{--sea:#173a6b;--sea2:#1d4a85;--ship:#9aa6c9;--hit:#ff5a4f;--miss:#5f84c4}
.seas{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.seas{grid-template-columns:1fr}}
.sea{display:flex;flex-direction:column;gap:8px;min-width:0}
.grid{display:grid;grid-template-columns:18px repeat(10,minmax(0,1fr));gap:2px;width:100%;max-width:420px}
.lab{font-size:.68rem;color:var(--muted);display:grid;place-items:center;font-weight:800}
.cell{aspect-ratio:1;border:0;padding:0;border-radius:4px;background:var(--sea);position:relative;display:grid;place-items:center}
button.cell{cursor:crosshair} button.cell:hover{background:var(--sea2);outline:2px solid var(--accent);outline-offset:-2px}
/* gemi parçaları: pruva (sivri uç), gövde (taret), kıç (köşeli). Dikeyde 90° döner. */
.cell.ship::before,.cell.sunk::before{content:"";position:absolute;inset:0 -1px;
  background:radial-gradient(circle at 50% 50%,#5b6690 0 17%,#3e4870 18% 22%,transparent 23%),linear-gradient(#d3d9ef,#8f9ac0 55%,#6d78a0)}
.cell.sunk::before{background:radial-gradient(circle at 50% 50%,#3a141b 0 17%,transparent 18%),linear-gradient(#a14a58,#6b2a35 60%,#4a1a23)}
.cell.p-mid::before{clip-path:polygon(0 18%,100% 18%,100% 82%,0 82%)}
.cell.p-bow::before{inset:0 -1px 0 0;clip-path:polygon(4% 50%,45% 18%,100% 18%,100% 82%,45% 82%);background-image:linear-gradient(#d3d9ef,#8f9ac0 55%,#6d78a0)}
.cell.p-stern::before{inset:0 0 0 -1px;clip-path:polygon(0 18%,80% 18%,94% 32%,94% 68%,80% 82%,0 82%);background-image:radial-gradient(circle at 40% 50%,#ffffff55 0 10%,transparent 11%),linear-gradient(#d3d9ef,#8f9ac0 55%,#6d78a0)}
.cell.sunk.p-bow::before,.cell.sunk.p-stern::before{background-image:linear-gradient(#a14a58,#6b2a35 60%,#4a1a23)}
.cell.o-v::before{transform:rotate(90deg)}
.cell.hit::after{content:"";width:55%;height:55%;border-radius:50%;background:var(--hit);box-shadow:0 0 8px var(--hit);position:relative;z-index:1}
.cell.miss::after{content:"";width:22%;height:22%;border-radius:50%;background:var(--miss)}
.cell.last{outline:2px solid #fff;outline-offset:-2px}
.status{font-family:var(--display);font-weight:800;font-size:1.25rem}
.log{font-size:.9rem;color:var(--muted);display:flex;flex-direction:column;gap:2px;max-height:140px;overflow:auto}
.log div:first-child{color:var(--ink);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="home" href="../">ATI <b>OYUN</b></a><h1>Amiral Battı</h1></div>
  <main id="app"></main>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="../assets/ek.js"></script>
<script src="../assets/net.js"></script>
<script src="logic.js"></script>
<script>
const app = document.getElementById('app'), esc = Ati.esc, L = 'ABCDEFGHIJ';
function gridHtml(b, { own, clickable, last }) {
  const shipAt = {};
  b.ships.forEach(sh => {
    const s = sh.cells.every(([r, c]) => b.recv[r + ',' + c] === 1);
    const vert = sh.cells.length > 1 && sh.cells[0][1] === sh.cells[1][1];
    sh.cells.forEach(([r, c], i) => {
      const part = i === 0 ? 'p-bow' : i === sh.cells.length - 1 ? 'p-stern' : 'p-mid';
      shipAt[r + ',' + c] = (s ? 'sunk ' : 'ship ') + part + (vert ? ' o-v' : '');
    });
  });
  let h = '<span></span>' + [...L].map(x => `<span class="lab">${x}</span>`).join('');
  for (let r = 0; r < 10; r++) {
    h += `<span class="lab">${r + 1}</span>`;
    for (let c = 0; c < 10; c++) {
      const key = r + ',' + c, shot = b.recv[key], st = shipAt[key];
      const cls = ['cell', st && (own || st.startsWith('sunk')) ? st : '', shot === 1 ? 'hit' : shot === 0 ? 'miss' : '', last && last.r === r && last.c === c ? 'last' : ''].join(' ');
      h += clickable && shot === undefined ? `<button class="${cls}" data-r="${r}" data-c="${c}" aria-label="${L[c]}${r + 1}"></button>` : `<div class="${cls}"></div>`;
    }
  }
  return `<div class="grid">${h}</div>`;
}
function render(v, ctx) {
  const me = ctx.me, idx = v.players.findIndex(p => p.id === me);
  if (v.phase === 'lobby') {
    app.innerHTML = `<section class="panel">${Ati.shareHtml(ctx)}
      <div><span class="label">Oyuncular (2 kişilik)</span><div class="row" style="margin-top:6px">${Ati.playersHtml(v, ctx)}</div></div>
      ${idx < 0 ? '<p class="muted">Oda dolu, izliyorsun.</p>' : ctx.isHost ? `<button class="btn" id="start" ${v.players.length < 2 ? 'disabled' : ''}>Başlat</button>` : '<p class="muted">Ev sahibinin başlatması bekleniyor...</p>'}
      </section><section class="panel"><p class="muted">Herkesin 5 gemisi var: ${Amiral.FLEET.map(f => f[0] + ' (' + f[1] + ')').join(', ')}. Gemiler birbirine değmez. Sırayla rakibin denizine atış yaparsınız. <b>Vurursan tekrar atarsın.</b> Rakibin bütün gemilerini ilk batıran kazanır.</p></section>`;
    Ati.wireShare(app, ctx);
    const s = app.querySelector('#start'); if (s) s.onclick = () => ctx.act({ type: 'start' });
    return;
  }
  if (idx < 0) { app.innerHTML = '<section class="panel"><p class="muted">Oda dolu, izliyorsun.</p></section>'; return }
  const P = v.players, opp = P[1 - idx], mb = v.boards[me], ob = v.boards[opp.id];
  const score = `<div class="row">${P.map(p => `<span class="pill">${esc(p.name)} · ${p.score}</span>`).join('')}</div>`;
  if (v.phase === 'setup') {
    app.innerHTML = `${score}<section class="panel"><div class="status">Gemilerini diz</div>
      <p class="muted">Beğenmezsen yeniden karıştır. Hazır olunca kilitle.</p>
      ${gridHtml(mb, { own: true })}
      <div class="row">${mb.ready ? `<span class="pill">Hazırsın. ${ob.ready ? '' : esc(opp.name) + ' bekleniyor...'}</span>` : '<button class="btn ghost" id="shuf">Yeniden karıştır</button><button class="btn" id="ready">Hazırım</button>'}</div></section>`;
    const s = app.querySelector('#shuf'); if (s) s.onclick = () => ctx.act({ type: 'shuffle' });
    const r = app.querySelector('#ready'); if (r) r.onclick = () => ctx.act({ type: 'ready' });
    return;
  }
  const myTurn = v.phase === 'play' && v.turn === idx;
  const ls = v.lastShot;
  const status = v.phase === 'over' ? (v.winner === idx ? 'Kazandın! Bütün filoyu batırdın.' : esc(opp.name) + ' kazandı.')
    : myTurn ? (ls && ls.by === idx && ls.hit ? 'İsabet! Tekrar at.' : 'Sıra sende, rakibin denizine ateş et.') : `Sıra ${ek(esc(opp.name),'de')}...`;
  app.innerHTML = `${score}<section class="panel"><div class="status">${status}</div>
    ${v.phase === 'over' ? '<button class="btn" id="again">Tekrar oyna</button>' : ''}</section>
    <section class="seas">
      <div class="panel sea"><span class="label">${ek(esc(opp.name),'in')} denizi${v.phase === 'play' ? ' · kalan gemi ' + ob.left : ''}</span>${gridHtml(ob, { own: v.phase === 'over', clickable: myTurn, last: ls && ls.by === idx ? ls : null })}</div>
      <div class="panel sea"><span class="label">Senin denizin</span>${gridHtml(mb, { own: true, last: ls && ls.by !== idx ? ls : null })}</div>
    </section>
    <section class="panel"><span class="label">Atışlar</span><div class="log">${(v.log || []).slice().reverse().map(l => `<div>${esc(l)}</div>`).join('')}</div></section>`;
  app.querySelectorAll('button.cell').forEach(b => b.onclick = () => ctx.act({ type: 'fire', r: +b.dataset.r, c: +b.dataset.c }));
  const g = app.querySelector('#again'); if (g) g.onclick = () => ctx.act({ type: 'start' });
}
Ati.start({ game: 'amiral', el: app, logic: Amiral, render });
</script>
</body>
</html>
