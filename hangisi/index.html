<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hangisi Daha Çok?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Nunito:wght@400;600;800&display=swap">
<link rel="stylesheet" href="../assets/style.css">
<style>
:root{--l:#4f8cff;--r:#ff8a3d}
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-weight:800;font-size:.9rem;padding:9px 14px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accentink)}
.q{font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,5vw,2rem);text-align:center}
.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.sec{font-family:var(--display);font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:6px;background:var(--edge);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:100%}
.bar i.low{background:var(--bad)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
@media (max-width:520px){.vs{grid-template-columns:1fr}.vs .or{justify-self:center}}
.ch{font:inherit;border:3px solid transparent;border-radius:18px;padding:20px 14px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;cursor:pointer;color:#0d1126;transition:transform .12s,opacity .2s}
.ch.l{background:var(--l)} .ch.r{background:var(--r)}
.ch:hover:not(:disabled){transform:translateY(-3px)}
.ch:disabled{cursor:default}
.ch .nm{font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,5vw,1.9rem);line-height:1.15;text-wrap:balance}
.ch .val{font-weight:800;font-size:1.05rem;background:rgba(255,255,255,.6);border-radius:999px;padding:3px 12px;font-variant-numeric:tabular-nums}
.ch.mine{border-color:var(--ink);box-shadow:0 0 0 4px var(--table2) inset}
.ch.dim{opacity:.35}
.ch.right{opacity:1;outline:4px solid var(--good);outline-offset:3px}
.ch .who{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.ch .who span{font-size:.75rem;background:rgba(13,17,38,.75);color:#fff;border-radius:999px;padding:2px 8px}
.or{align-self:center;font-family:var(--display);font-weight:800;color:var(--muted)}
.ppl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ppl span{font-weight:800;font-size:.85rem;padding:4px 10px;border-radius:999px;border:1px solid var(--edge)}
.ppl span.ok{border-color:var(--good);color:var(--good)}
.res{font-weight:800;text-align:center}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
td,th{padding:8px 6px;border-bottom:1px solid var(--edge);text-align:left}
th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.n,th.n{text-align:right}
.plus{color:var(--good);font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="home" href="../">ATI <b>OYUN</b></a><h1>Hangisi Daha Çok?</h1></div>
  <main id="app"></main>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="../assets/ek.js"></script>
<script src="../assets/net.js"></script>
<script src="veri.js"></script>
<script src="logic.js"></script>
<script>
const app = document.getElementById('app'), esc = Ati.esc;
let count = 15, V, C, qKey = '', shownAt = 0, timerFor = '', raf = 0;
const fmt = (n, cat) => cat.year ? String(n) : n.toLocaleString('tr-TR') + (cat.unit ? ' ' + cat.unit : '');
function tick() {
  const bar = document.getElementById('tbar'), sec = document.getElementById('tsec');
  if (!bar || !V || V.phase !== 'q') { raf = 0; return }
  const left = Math.max(0, Hangisi.TIME - (performance.now() - shownAt));
  bar.style.width = (left / Hangisi.TIME * 100) + '%'; bar.classList.toggle('low', left < 3000); sec.textContent = Math.ceil(left / 1000);
  raf = requestAnimationFrame(tick);
}
function table(v, final) {
  const r = v.players.slice().sort((a, b) => b.score - a.score);
  return `<table><thead><tr><th>#</th><th>Oyuncu</th>${final ? '<th class="n">Doğru</th><th class="n">En uzun seri</th>' : ''}<th class="n">Puan</th></tr></thead><tbody>${r.map((p, i) => `<tr><td>${i + 1}</td><td>${esc(p.name)}${p.id === C.me ? ' (sen)' : ''}</td>${final ? `<td class="n">${p.right || 0}/${v.qs.length}</td><td class="n">${p.best || 0}</td>` : ''}<td class="n">${p.score}${!final && v.gain && v.gain[p.id] ? ` <span class="plus">+${v.gain[p.id]}</span>` : ''}</td></tr>`).join('')}</tbody></table>`;
}
function render(v, ctx) {
  V = v; C = ctx;
  const me = ctx.me, P = v.players, mine = P.find(p => p.id === me);
  if (v.phase === 'lobby') {
    app.innerHTML = `<section class="panel">${Ati.shareHtml(ctx)}
      <div><span class="label">Oyuncular (2-8 kişi)</span><div class="row" style="margin-top:6px">${Ati.playersHtml(v, ctx)}</div></div>
      ${!mine ? '<p class="muted">Oyun başladı, izliyorsun.</p>' : ctx.isHost ? `
        <div class="row"><span class="label">Tur sayısı</span><span class="seg">${[10, 15, 20].map(n => `<button data-n="${n}" class="${count === n ? 'on' : ''}">${n}</button>`).join('')}</span></div>
        <button class="btn" id="start" ${P.length < 2 ? 'disabled' : ''}>Başlat</button>` : '<p class="muted">Ev sahibinin başlatması bekleniyor...</p>'}
      </section><section class="panel"><h2>Nasıl oynanır?</h2><p class="muted">İki şey gelir: "Everest mi, K2 mi?", "Galatasaray mı önce kuruldu, Fenerbahçe mi?" gibi. Doğru olana ${Hangisi.TIME / 1000} saniye içinde dokun. Doğru cevap 100 puan, hızlıysan +50'ye kadar bonus. Hız herkesin kendi cihazında ölçülür.</p>
      <p class="muted">Kategoriler: dağlar ve binalar, nehirler, ülkelerin yüzölçümü, gezegenler, elementler, tarihi olaylar ve kulüplerin kuruluşu.</p></section>`;
    Ati.wireShare(app, ctx);
    app.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { count = +b.dataset.n; render(V, C) });
    const s = app.querySelector('#start'); if (s) s.onclick = () => ctx.act({ type: 'start', count });
    return;
  }
  if (v.phase === 'over') {
    const r = P.slice().sort((a, b) => b.score - a.score), tie = r[1] && r[0].score === r[1].score;
    app.innerHTML = `<section class="panel"><span class="label">Oyun bitti</span><h2>${tie ? 'Berabere!' : esc(r[0].name) + ' kazandı!'}</h2>${table(v, true)}
      ${ctx.isHost ? '<button class="btn" id="again">Tekrar oyna</button>' : '<p class="muted">Ev sahibi yeni oyun başlatabilir.</p>'}</section>`;
    const g = app.querySelector('#again'); if (g) g.onclick = () => ctx.act({ type: 'start', count: v.qs.length });
    return;
  }
  const R = v.qs[v.cur], cat = HANGISI[R.c], A = cat.items[R.a], B = cat.items[R.b], key = v.cur + ':' + R.c + ':' + R.a + ':' + R.b;
  if (v.phase === 'q' && key !== qKey) { qKey = key; shownAt = performance.now() }
  if (ctx.isHost && v.phase === 'q' && timerFor !== key) { timerFor = key; const cur = v.cur; setTimeout(() => ctx.act({ type: 'timeout', cur }), Hangisi.TIME + 1400) }
  const reveal = v.phase === 'reveal', right = Hangisi.correctSide(R), myAns = v.ans[me];
  const who = k => P.filter(p => v.ans[p.id] && v.ans[p.id].k === k).map(p => `<span>${esc(p.name)}</span>`).join('');
  const card = (it, k) => {
    let cls = k ? 'r' : 'l';
    if (reveal) cls += k === right ? ' right' : ' dim'; else if (myAns) cls += myAns.k === k ? ' mine' : ' dim';
    return `<button class="ch ${cls}" data-k="${k}" ${myAns || reveal || !mine ? 'disabled' : ''}><span class="nm">${esc(it[0])}</span>${reveal ? `<span class="val">${fmt(it[1], cat)}</span><span class="who">${who(k)}</span>` : ''}</button>`;
  };
  let foot;
  if (reveal) {
    const g = v.gain[me];
    foot = `<p class="res" style="color:var(${g ? '--good' : '--bad'})">${!mine ? '' : g ? 'Doğru! +' + g : myAns ? 'Yanlış!' : 'Süre doldu!'}</p><button class="btn" id="next">${v.cur + 1 >= v.qs.length ? 'Sonuçları gör' : 'Sonraki'}</button>`;
  } else foot = `<div class="ppl">${P.map(p => `<span class="${v.ans[p.id] ? 'ok' : ''}">${esc(p.name)} ${v.ans[p.id] ? '✓' : '…'}</span>`).join('')}</div>`;
  app.innerHTML = `<section class="panel">
      <div class="topline"><span class="pill">Tur ${v.cur + 1}/${v.qs.length}</span>${reveal ? '' : '<span class="sec" id="tsec"></span>'}</div>
      ${reveal ? '' : '<div class="bar"><i id="tbar"></i></div>'}
      <div class="q">${esc(cat.q)}</div>
      <div class="vs">${card(A, 0)}<span class="or">ya da</span>${card(B, 1)}</div>${foot}</section>
    <section class="panel"><span class="label">Puan durumu</span>${table(v, false)}</section>`;
  app.querySelectorAll('.ch[data-k]').forEach(b => b.onclick = () => {
    const ms = Math.round(performance.now() - shownAt);
    app.querySelectorAll('.ch').forEach(x => x.disabled = true);
    ctx.act({ type: 'answer', k: +b.dataset.k, ms });
  });
  const n = app.querySelector('#next'); if (n) n.onclick = () => ctx.act({ type: 'next' });
  if (!reveal && !raf) raf = requestAnimationFrame(tick);
}
document.addEventListener('keydown', e => {
  if (!V || V.phase !== 'q') return;
  const k = e.key === 'ArrowLeft' ? 0 : e.key === 'ArrowRight' ? 1 : null;
  if (k !== null) { const b = app.querySelector(`.ch[data-k="${k}"]:not([disabled])`); if (b) b.click() }
});
Ati.start({ game: 'hangisi', el: app, logic: Hangisi, render });
</script>
</body>
</html>
